name: Build OBAMA Android

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find or extract Android project
        shell: bash
        run: |
          set -e

          if [[ -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
            exit 0
          fi

          ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"

          if [[ -z "$ZIP_FILE" ]]; then
            echo "No Android project or ZIP file was found in the repository."
            exit 1
          fi

          rm -rf .github/android-project
          mkdir -p .github/android-project

          echo "Extracting: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d .github/android-project

          PROJECT_SETTINGS="$(find .github/android-project -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"

          if [[ -z "$PROJECT_SETTINGS" ]]; then
            echo "The ZIP does not contain an Android Gradle project."
            echo "settings.gradle or settings.gradle.kts was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_SETTINGS")"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project found at:"
          echo "$PROJECT_DIR"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: bash
        run: |
          set -e

          if [[ -n "$GEMINI_API_KEY" ]]; then
            gradle \
              --no-daemon \
              -p "$PROJECT_DIR" \
              :app:assembleDebug \
              -PGEMINI_API_KEY="$GEMINI_API_KEY"
          else
            echo "GEMINI_API_KEY secret not set."
            echo "Building without API key for compile testing."

            gradle \
              --no-daemon \
              -p "$PROJECT_DIR" \
              :app:assembleDebug
          fi

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: OBAMA-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
